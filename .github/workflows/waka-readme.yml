name: Waka Readme

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/waka-readme.yml'

concurrency:
  group: waka-readme
  cancel-in-progress: false

jobs:
  update-readme:
    name: Update WakaTime Stats
    runs-on: ubuntu-latest
    timeout-minutes: 8

    permissions:
      contents: write

    steps:
      - name: Check WakaTime API access
        env:
          WAKATIME_OAUTH_TOKEN: ${{ secrets.WAKATIME_OAUTH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${WAKATIME_OAUTH_TOKEN}" ]; then
            echo "::error::WAKATIME_OAUTH_TOKEN is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

          status="$(curl --silent --show-error \
            --output /tmp/waka-response.json \
            --write-out "%{http_code}" \
            --user "${WAKATIME_OAUTH_TOKEN}:" \
            "https://wakatime.com/api/v1/users/current/stats/last_7_days")"

          if [ "${status}" != "200" ]; then
            echo "::error::WakaTime API returned HTTP ${status}. The workflow is reaching WakaTime, but the API rejected this key/request."
            if command -v jq >/dev/null 2>&1; then
              message="$(jq -r '.error // .message // empty' /tmp/waka-response.json)"
              if [ -n "${message}" ]; then
                echo "WakaTime response: ${message}"
              fi
            fi
            echo "Check that WAKATIME_OAUTH_TOKEN is the current API key from your WakaTime account. If it was rotated, update the repository secret."
            exit 1
          fi

          echo "WakaTime OAuth access verified."

      - name: Update README coding stats
        uses: athul/waka-readme@v0.3.1
        with:
          # This action input is named WAKATIME_API_KEY, but WakaTime now requires an OAuth token.
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          SHOW_TITLE: true
          SHOW_TIME: true
          SHOW_TOTAL: true
          TIME_RANGE: last_7_days
          LANG_COUNT: 5
